<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="specular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Main Ball Shadow -->
  <circle cx="32" cy="35" r="28" fill="#000000" opacity="0.4"/>
  <!-- Main Ball Sphere -->
  <circle cx="32" cy="32" r="28" fill="url(#ballGrad)"/>
  <!-- Specular Reflection -->
  <ellipse cx="25" cy="18" rx="12" ry="6" transform="rotate(-30 25 18)" fill="url(#specular)"/>
  <!-- Inner White Circle -->
  <circle cx="32" cy="32" r="16" fill="#ffffff" stroke="#fef3c7" stroke-width="1.5"/>
  <!-- "B" Letter / Text -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, Arial Black, Impact, sans-serif" font-weight="900" font-size="18" fill="#b45309" text-anchor="middle">B</text>
</svg>
